[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atomno-mcp-seo-audit"
version = "0.4.2"
description = "MCP server for technical SEO audits powered by the detail.web engine: site health score, issues across 8 categories and a GEO (AI-search visibility) sub-score."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "atomno-labs", email = "hello@atomno-labs.ru" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "seo",
  "seo-audit",
  "technical-seo",
  "geo",
  "generative-engine-optimization",
  "robots-txt",
  "sitemap",
  "schema-org",
  "site-audit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: AsyncIO",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "fastmcp>=3.0.0,<4.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.6.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/atomno-mcp/mcp-seo-audit"
Repository = "https://github.com/atomno-mcp/mcp-seo-audit"
Issues = "https://github.com/atomno-mcp/mcp-seo-audit/issues"
Changelog = "https://github.com/atomno-mcp/mcp-seo-audit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/atomno-mcp/mcp-seo-audit#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
]
release = [
  "build>=1.2.0",
  "twine>=5.1.0",
]

[project.scripts]
atomno-mcp-seo-audit = "atomno_mcp_seo_audit.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atomno_mcp_seo_audit"]

[tool.hatch.build.targets.sdist]
include = [
  "src/atomno_mcp_seo_audit/**",
  "tests/**",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
  ".env.example",
]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  ".venv/**",
  ".pytest_cache/**",
  ".coverage",
  "htmlcov/**",
  "dist/**",
  "build/**",
  "*.egg-info/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/atomno_mcp_seo_audit"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]
